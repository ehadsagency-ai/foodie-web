<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foodie — Meal &amp; Nutrition Marketplace</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1d1d1f; }
    .hero { max-width: 600px; margin: 0 auto; padding: 80px 24px 60px; text-align: center; }
    h1 { font-size: 3rem; font-weight: 700; margin-bottom: 16px; }
    .tagline { font-size: 1.2rem; color: #6e6e73; margin-bottom: 48px; }
    .badge { display: inline-block; background: #000; color: #fff; padding: 14px 28px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 1rem; }
    .badge:hover { background: #333; }
    nav { margin-top: 60px; display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; }
    nav a { color: #0066cc; text-decoration: none; font-size: 0.95rem; }
    nav a:hover { text-decoration: underline; }
    footer { margin-top: 80px; text-align: center; padding: 24px; border-top: 1px solid #d2d2d7; color: #6e6e73; font-size: 0.875rem; }
    .accent { color: #e63946; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Foodie<span class="accent">.</span></h1>
    <p class="tagline">Meal &amp; Nutrition Marketplace — Available on the App Store</p>
    <a class="badge" href="https://apps.apple.com/app/id6759874216">Download on the App Store</a>
    <nav>
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Service</a>
      <a href="/cookies">Cookie Policy</a>
      <a href="mailto:support@foodie.fr">Support</a>
    </nav>
  </div>
  <footer>&copy; 2026 E&amp;H Studio</footer>
</body>
</html>
